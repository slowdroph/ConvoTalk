map $uri $robots_tag {
    default "";
    ~^/(chat|feed|discover|profile|settings|verify-email|reset-password|confirm-email-change)(/|$) "noindex, nofollow";
    ~^/(app|404)\.html$ "noindex, nofollow";
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Empty for public pages, so the header is only sent where it applies.
    add_header X-Robots-Tag $robots_tag always;

    # Public pages are prerendered to <route>.html (see scripts/prerender.mjs).
    # .html is tried before the bare path so /es resolves to es.html instead of
    # the es/ directory that holds the nested locale pages.
    location / {
        try_files $uri.html $uri $uri/index.html =404;
    }

    # English is the default locale and is served unprefixed.
    location = /en {
        return 301 /;
    }

    location ~ ^/en/(.+)$ {
        return 301 /$1;
    }

    # The authenticated app stays a client-side SPA.
    location ~ ^/(chat|feed|discover|profile|settings|verify-email|reset-password|confirm-email-change)(/|$) {
        try_files /app.html =404;
    }

    location = /index.html {
        return 301 /;
    }

    error_page 404 /404.html;

    location = /404.html {
        internal;
    }

    # Hashed build assets (cacheable forever)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # REST API proxy
    location /api/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }

    # Socket.IO proxy (WebSocket upgrade)
    location /socket.io/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
