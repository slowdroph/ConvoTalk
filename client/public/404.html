<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="robots" content="noindex, nofollow" />
        <title>Page not found | ConvoTalk</title>
        <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
        <style>
            :root {
                color-scheme: dark;
            }
            * {
                box-sizing: border-box;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 24px;
                background: #0e150e;
                color: #e6efe6;
                font-family:
                    "Hanken Grotesk", ui-sans-serif, system-ui, -apple-system,
                    "Segoe UI", sans-serif;
                text-align: center;
            }
            main {
                max-width: 32rem;
            }
            p.code {
                margin: 0 0 8px;
                font-size: 13px;
                font-weight: 700;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: #59e07b;
            }
            h1 {
                margin: 0 0 12px;
                font-size: 32px;
                line-height: 1.2;
            }
            p.lead {
                margin: 0 0 28px;
                font-size: 16px;
                line-height: 1.6;
                color: #9fb29f;
            }
            nav {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
                justify-content: center;
            }
            a {
                display: inline-block;
                padding: 12px 20px;
                border-radius: 8px;
                font-size: 14px;
                font-weight: 600;
                text-decoration: none;
                color: #0e150e;
                background: #59e07b;
            }
            a.secondary {
                color: #e6efe6;
                background: transparent;
                border: 1px solid #2a3a2a;
            }
        </style>
    </head>
    <body>
        <main>
            <p class="code">404</p>
            <h1>This page doesn't exist</h1>
            <p class="lead">
                The link may be broken, or the page may have been moved.
            </p>
            <nav>
                <a href="/">Back to home</a>
                <a class="secondary" href="/login">Sign in</a>
            </nav>
        </main>
    </body>
</html>
